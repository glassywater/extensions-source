name: Build Zaimanhua

on:
  # 每天北京时间 03:00 检查上游，有相关改动才重编
  schedule:
    - cron: '0 19 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: '无论上游是否有相关改动都强制重编'
        type: boolean
        default: true
  push:
    branches: [zaimanhua]
    paths:
      - 'src/zh/zaimanhua/**'

permissions:
  contents: write

concurrency:
  group: build-zaimanhua
  cancel-in-progress: false

env:
  UPSTREAM_REPO: keiyoushi/extensions-source
  UPSTREAM_BRANCH: main
  # 上游这些路径有改动时才需要重编(zaimanhua 源码 + 公共构建依赖)
  RELEVANT_PATHS: '^(src/zh/zaimanhua/|common/|core/|compiler/|gradle/|build\.gradle\.kts$|settings\.gradle\.kts$|gradle\.properties$)'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: zaimanhua
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      # 在 runner 里临时合并上游，不推回分支
      # (GITHUB_TOKEN 无权推送上游对 .github/workflows 的改动)
      - name: Merge upstream
        id: merge
        run: |
          set -e
          git remote add upstream "https://github.com/$UPSTREAM_REPO.git"
          git fetch --filter=blob:none upstream "$UPSTREAM_BRANCH"
          UPSTREAM_SHA=$(git rev-parse "upstream/$UPSTREAM_BRANCH")
          echo "upstream_sha=$UPSTREAM_SHA" >> "$GITHUB_OUTPUT"
          echo "branch_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com \
            merge --no-edit "upstream/$UPSTREAM_BRANCH" \
            || { echo "::error::合并上游冲突，需要手动在 zaimanhua 分支解决"; exit 1; }

      - name: Decide whether to build
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_SHA: ${{ steps.merge.outputs.upstream_sha }}
          BRANCH_SHA: ${{ steps.merge.outputs.branch_sha }}
        run: |
          set -e
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          BODY=$(gh release view apk -R "$GITHUB_REPOSITORY" --json body --jq .body 2>/dev/null || true)
          LAST_UPSTREAM=$(printf '%s\n' "$BODY" | sed -n 's/^upstream: *\([0-9a-f]\{40\}\).*/\1/p' | head -n 1)
          LAST_BRANCH=$(printf '%s\n' "$BODY" | sed -n 's/^branch: *\([0-9a-f]\{40\}\).*/\1/p' | head -n 1)
          if [ -z "$LAST_UPSTREAM" ] || ! git cat-file -e "$LAST_UPSTREAM^{commit}" 2>/dev/null; then
            echo "没有找到上次构建记录，执行构建"
            echo "build=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$LAST_BRANCH" != "$BRANCH_SHA" ]; then
            echo "zaimanhua 分支有新提交，执行构建"
            echo "build=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          CHANGED=$(git diff --name-only "$LAST_UPSTREAM" "$UPSTREAM_SHA" | grep -E "$RELEVANT_PATHS" || true)
          if [ -n "$CHANGED" ]; then
            echo "上游相关改动："; echo "$CHANGED"
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "上游自 ${LAST_UPSTREAM:0:9} 起无相关改动，跳过构建"
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Java
        if: steps.decide.outputs.build == 'true'
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Gradle
        if: steps.decide.outputs.build == 'true'
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - name: Build Zaimanhua debug APK
        if: steps.decide.outputs.build == 'true'
        run: ./gradlew :src:zh:zaimanhua:assembleDebug --stacktrace

      - name: Publish raw APK as release asset
        if: steps.decide.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_SHA: ${{ steps.merge.outputs.upstream_sha }}
          BRANCH_SHA: ${{ steps.merge.outputs.branch_sha }}
        run: |
          set -e
          APK=$(find . -path '*/build/outputs/apk/debug/*.apk' | head -n 1)
          test -n "$APK" || { echo "APK not found"; exit 1; }
          echo "Found APK: $APK"
          cp "$APK" zaimanhua.apk
          NOTES=$(printf '%s\n\n%s\n%s\n%s\n' \
            "自动构建的 debug 签名 APK（分支 zaimanhua 合并上游 $UPSTREAM_REPO@$UPSTREAM_BRANCH）。直接下载 zaimanhua.apk 安装，无需解压。" \
            "built: $(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            "upstream: $UPSTREAM_SHA" \
            "branch: $BRANCH_SHA")
          if gh release view apk -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload apk zaimanhua.apk --clobber -R "$GITHUB_REPOSITORY"
            gh release edit apk --notes "$NOTES" -R "$GITHUB_REPOSITORY"
          else
            gh release create apk zaimanhua.apk -R "$GITHUB_REPOSITORY" --target zaimanhua --title "Zaimanhua debug APK" --notes "$NOTES"
          fi
